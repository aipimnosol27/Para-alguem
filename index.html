<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Importante -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <!-- Autor e Descrição -->
  <meta name="author" content="Paulo">
  <meta name="description" content="Para alguém.">
  <!-- Titulo e icone do site -->
  <link rel="icon" type="image/png" href="https://pngimg.com/uploads/heart/small/heart_PNG706.png">
  <title>Para alguém.</title>
  <!-- Parte do CSS -->
  <style>
    body {
      /** Alinhamento **/
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      /** Texto **/
      font-size: 23px;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

      /** Coração **/
      #coracao {
        filter: blur(30px);
      }

      #coracao:hover {
        filter: blur(10px);
      }

      /** Body **/
      background-color: #310000;

      div {
        border: red solid 15px;
        border-radius: 40px;
        padding: 40px;
        width: 300px;
        color: white;
        box-shadow:
          0 0 30px red;
        text-shadow:
          0 5px 10px white;
      }

      /** Header **/
      header {
        color: white;
        width: 100%;
        height: 100px;
      }

      nav {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 40px;

        background-color: #310000;
        border: #b90000ad solid 5px;
        border-radius: 30px;
      }

      nav h2 {
        transform: translatex(-50px);
        text-shadow:
          0 5px 10px white;
      }

      /** Footer **/
      footer {
        color: white;
        width: 100%;
        height: 100px;
      }

      footer section {
        background-color: #310000;
        border: #b90000 solid 5px;
        border-radius: 30px;
        text-shadow:
          0 5px 10px white;
      }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header>
    <nav>
      <h2>Te Amo.</h2>
    </nav>
  </header>
  <br><br>

  <!-- Main -->
  <main>
    <!-- Sections -->
    <section>
      <div>
        <p>
          Para a você<br>
          <strong>.......</strong>
        </p>
        <img id="coracao" src="https://pngimg.com/uploads/heart/small/heart_PNG706.png" width="200px" height="200px">
        <h2>Te Amo.</h2>
      </div>
    </section>
  </main>
  <br><br>

  <!-- Footer -->
  <footer>
    <section>
      <p>
        09/10/2026,<br>
        Desenvolvido em HTML, CSS e JavaScript.<br>
      </p>
    </section>
  </footer>
</body>
</html>
